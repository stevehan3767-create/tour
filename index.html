<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1565C0" />
    <title>백운호수 푸르지오 숲속의 아침 여행동호회</title>
    <meta name="description" content="경기 의왕시 백운호수 푸르지오 숲속의 아침 여행을 사랑하는 사람들의 모임 - 여행 사진, 영상, 공지사항" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231565C0'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%9A%8C%3C/text%3E%3C/svg%3E" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        font-family: 'Noto Sans KR', sans-serif;
        background: #F2F8F5;
        font-size: 18px;
        line-height: 1.6;
        color: #1c2b22;
      }
      button { cursor: pointer; transition: transform 0.15s, opacity 0.15s; font-family: inherit; }
      button:hover { opacity: 0.9; }
      button:active { transform: scale(0.98); }
      input, textarea, select { outline: none; font-family: inherit; font-size: 17px; }
      img, video { max-width: 100%; display: block; }
      a { color: inherit; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: #b7d3c4; border-radius: 10px; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes heroFade {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
